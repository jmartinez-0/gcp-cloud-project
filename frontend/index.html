<!DOCTYPE html>
<html>
<head>
    <title>User List App</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        input { padding: 8px; margin: 5px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; }
        .user-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        #login-section { display: block; }
        #users-section { display: none; }
    </style>
</head>
<body>
    <div id="login-section">
        <h2>Login - v5</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign Up</button>
    </div>

    <div id="users-section">
        <h2>Users</h2>
        <button id="logout-btn">Logout</button>
        <form id="user-form">
            <h3 id="user-form-title">Create user</h3>
            <input id="user-id" type="hidden">
            <input id="user-name" type="text" placeholder="Name" required>
            <input id="user-email" type="email" placeholder="Email" required>
            <input id="user-age" type="number" placeholder="Age">
            <input id="user-location" type="text" placeholder="Location">
            <input id="user-job-title" type="text" placeholder="Job title">
            <input id="user-created-at" type="text" placeholder="Created at">
            <button type="submit">Save user</button>
            <button id="cancel-edit-btn" type="button" hidden>Cancel edit</button>
        </form>
        <div id="user-list"></div>
    </div>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
